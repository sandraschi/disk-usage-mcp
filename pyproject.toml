[project]
name = "disk-usage-mcp"
version = "0.1.0"
description = "Multi-drive disk usage analysis with dua-cli and czkawka_cli — treemap visualisation, duplicate hunting, large file detection"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0,<0.17",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
inspect = ["pymupdf"]

[dependency-groups]
dev = [
    "ruff>=0.16.0,<0.17",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 40
show_missing = true

[project.scripts]
disk-usage-mcp = "disk_usage_mcp.server:main"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["T20"]
"scripts/**/*" = ["T20"]
"run_server.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
